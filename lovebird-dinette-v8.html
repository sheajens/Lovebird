<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4efe4">
  <meta name="description" content="Lovebird Dinette is coming soon. A neighborhood restaurant. Good food. Not too fussy. Join our mailing list by email or text.">
  <title>Coming Soon — Lovebird Dinette</title>
  <style>
    :root { color-scheme: light; --cream:#f4efe4; --ink:#171613; --paper:#ffffff; --muted:#625f57; }
    * { box-sizing:border-box; }
    html { min-height:100%; }
    body { margin:0; min-height:100vh; background:var(--cream); color:var(--ink); font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif; display:grid; place-items:center; padding:clamp(24px,5vw,64px) 18px; }
    .page { width:min(100%,680px); text-align:center; }
    .eyebrow { margin:0 0 clamp(28px,5vw,48px); color:var(--ink); font-size:clamp(2rem,7vw,3.25rem); font-weight:300; line-height:1; letter-spacing:.085em; }
    .brand-card { min-height:290px; background:var(--cream); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:26px 24px 24px; box-shadow:none; }
    .full-logo { display:block; width:min(100%,390px); height:auto; mix-blend-mode:multiply; }
    .bird-image { display:block; width:min(100%,280px); height:auto; }
    .word-image { display:block; width:min(100%,260px); height:auto; }
    .wordmark { margin:0; color:#151613; font-family: Georgia, "Times New Roman", serif; font-size:clamp(2.45rem,8vw,3.35rem); font-weight:400; letter-spacing:-.055em; line-height:.95; }
    .submark { margin:8px 0 0; font-size:.95rem; font-weight:600; letter-spacing:.38em; padding-left:.38em; }
    .tagline { max-width:610px; margin:clamp(28px,5vw,42px) auto 0; color:var(--ink); font-size:clamp(1.05rem,3vw,1.35rem); line-height:1.45; font-weight:400; }
    .tagline-primary, .tagline-secondary { display:block; }
    .tagline-primary { font-weight:700; }
    .tagline-secondary { margin-top:5px; font-size:clamp(.88rem,2.4vw,1.05rem); }
    .signup { max-width:520px; margin:clamp(34px,6vw,52px) auto 0; color:var(--ink); }
    .signup h2 { margin:0 0 9px; font-family:Georgia, "Times New Roman", serif; font-size:clamp(1.55rem,4vw,1.9rem); font-weight:400; }
    .signup p { margin:0 auto 20px; max-width:440px; line-height:1.55; color:var(--ink); }
    .form-row { display:flex; gap:10px; }
    label { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    input[type=text] { min-width:0; flex:1; min-height:52px; border:1px solid #d8d0c2; border-radius:2px; background:#fff; padding:0 16px; color:var(--ink); font:inherit; }
    input[type=email]:focus-visible, button:focus-visible { outline:3px solid #26392d; outline-offset:3px; }
    button { min-height:52px; border:1px solid var(--ink); border-radius:2px; background:transparent; color:var(--ink); padding:0 21px; font:600 .95rem inherit; font-family:inherit; font-size:.95rem; font-weight:650; cursor:pointer; transition:background .18s ease,color .18s ease; }
    button:hover { background:var(--ink); color:var(--paper); }
    button:disabled { opacity:.72; cursor:wait; }
    .message { min-height:1.5em; margin:13px 0 0 !important; font-size:.94rem; }
    .message[data-state="error"] { color:var(--ink); }
    .message[data-state="success"] { color:var(--ink); font-weight:600; }
    .footer { margin:30px 0 0; font-size:.77rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink); }
    @media (max-width:480px) { body { padding:26px 18px 32px; } .brand-card { min-height:235px; } .form-row { flex-direction:column; } button { width:100%; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; } }
  </style>
</head>

    <p class="tagline"><span class="tagline-primary">A neighborhood restaurant</span><span class="tagline-secondary">Good food. Not too fussy</span></p>
    <section class="signup" aria-labelledby="signup-title">
      <h2 id="signup-title">Can we send you a little note when we open?</h2>
      <p>Join our mailing list.</p>
      <form id="signup-form" novalidate>
        <div class="form-row">
          <label for="contact">Email or phone number</label>
          <input id="contact" name="contact" type="text" autocomplete="on" inputmode="text" placeholder="Your email or phone number" autocapitalize="off" spellcheck="false" required aria-describedby="form-message">
          <button id="submit-button" type="submit">Keep me posted</button>
        </div>
        <p class="message" id="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>
    <p class="footer">Good things are on the way</p>
  </main>
  <script>
    // MAILING LIST SETUP: Set SIGNUP_ENDPOINT to your provider's secure signup URL.
    // The endpoint should accept JSON: { "contact": "...", "contactType": "email" | "phone" } and return a 2xx response.
    // Keep private API keys on your server; never place a secret key in this public file.
    const SIGNUP_ENDPOINT = ""; // Example: "https://your-site.example/api/mailing-list"

    const form = document.querySelector("#signup-form");
    const contactInput = document.querySelector("#contact");
    const message = document.querySelector("#form-message");
    const button = document.querySelector("#submit-button");

    function showMessage(text, state) {
      message.textContent = text;
      message.dataset.state = state;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const contact = contactInput.value.trim();
      const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact);
      const phoneDigits = contact.replace(/\D/g, "");
      const isPhone = /^\+?[\d\s().-]+$/.test(contact) && phoneDigits.length >= 7 && phoneDigits.length <= 15;
      const contactType = isEmail ? "email" : isPhone ? "phone" : "";
      contactInput.setCustomValidity("");
      if (!contactType) {
        contactInput.setCustomValidity("Enter a valid email address or phone number.");
        contactInput.reportValidity();
        showMessage("Please enter a valid email address or phone number.", "error");
        return;
      }
      if (!SIGNUP_ENDPOINT) {
        showMessage("Thanks for your interest! The signup form is not connected yet, so your contact info was not submitted. Please check back soon.", "error");
        return;
      }
      button.disabled = true;
      button.textContent = "Joining…";
      showMessage("Sending your signup…", "pending");
      try {
        const response = await fetch(SIGNUP_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({ contact, contactType })
        });
        if (!response.ok) throw new Error("Signup request was not accepted");
        form.reset();
        showMessage("You’re on the list. We’ll be in touch when Lovebird opens.", "success");
      } catch (error) {
        showMessage("We couldn’t submit your signup just now. Please try again in a moment.", "error");
      } finally {
        button.disabled = false;
        button.textContent = "Keep me posted";
      }
    });
  </script>
